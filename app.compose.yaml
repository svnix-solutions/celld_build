# One-shot app deploy: bundle a Wrangler project with esbuild, publish it to
# the fleet bucket with `celld deploy`, then POST /reload so the node adopts it
# now. The container exits; the node keeps serving the previous deployment if
# the new one fails to build.
#
# Needs the celld-fleet stack running (network celld_internal, image
# local/celld-tools). One Komodo stack per app; copy this file and app.Dockerfile
# into each app repo, or point APP_DIR at a folder in this repo.

name: celld-app-${APP_NAME:?set APP_NAME}

services:
  deploy:
    build:
      context: .
      dockerfile: app.Dockerfile
      args:
        APP_DIR: ${APP_DIR:?set APP_DIR, e.g. apps/hello}
        CELLD_VERSION: ${CELLD_VERSION:-0.6.2}
    image: local/celld-app-${APP_NAME}:latest
    pull_policy: build
    container_name: celld-deploy-${APP_NAME}
    restart: "no"
    environment:
      CELLD_BUCKET: s3://${CELLD_BUCKET_NAME:-celld}
      S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      CELLD_RELOAD_URL: http://${CELLD_INTERNAL_IP:-172.30.70.10}:8081/reload
    networks: [internal]

networks:
  internal:
    name: celld_internal
    external: true
