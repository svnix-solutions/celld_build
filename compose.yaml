# celld fleet: local SeaweedFS bucket + one celld node, fronted by Nginx Proxy Manager.
#
#   NPM ──(PROXY_NETWORK)──► celld :8080  public Worker listener
#                            celld :8081  peer/operator API, celld_internal only
#                        seaweedfs :8333  fleet bucket (S3), celld_internal only
#
# celld_internal is `internal: true`: nothing on it can reach the internet, and
# nothing outside it can reach the operator API or the bucket.

name: celld-fleet

x-bucket-env: &bucket-env
  CELLD_BUCKET: s3://${CELLD_BUCKET_NAME:-celld}
  S3_ENDPOINT: http://seaweedfs:8333
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}

services:
  seaweedfs:
    # All-in-one SeaweedFS: master + volume + filer (leveldb2) + S3 gateway.
    # Conditional PUTs (If-None-Match / If-Match) run under a per-object write
    # lock in the S3 gateway, which is what celld's leases need. celld has not
    # qualified SeaweedFS: every node re-runs its storage test at boot and
    # refuses to serve if the store fails it.
    # Primary registry: release CI builds here, then copies the same digest to
    # Docker Hub (chrislusf/seaweedfs), which lags. Pin releases, never `dev`.
    image: ghcr.io/chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.48}
    restart: unless-stopped
    command:
      - server
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -filer
      - -s3
      - -s3.port=8333
    environment:
      # Static admin identity. Setting it turns S3 auth on, so anonymous
      # requests are denied. Scoped users/policies: `weed shell` (see README).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - ${SEAWEEDFS_DATA:-seaweedfs-data}:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  tools:
    # Builds the shared tools image (celld CLI + esbuild) and creates the bucket.
    build:
      context: ./tools
      args:
        CELLD_VERSION: ${CELLD_VERSION:-0.6.2}
    image: local/celld-tools:${CELLD_VERSION:-0.6.2}
    pull_policy: build
    command: ["node", "/opt/celld-tools/bin/ensure-bucket.mjs"]
    environment: *bucket-env
    restart: "no"
    networks: [internal]
    depends_on:
      seaweedfs:
        condition: service_healthy

  celld:
    image: ghcr.io/denoland/celld:${CELLD_VERSION:-0.6.2}
    restart: unless-stopped
    # celld's supervisor contract: restart forever, and wait at least one lease
    # lifetime (CELLD_TTL_MS, 10 s) between attempts. Docker's restart backoff
    # starts at 100 ms, so the delay lives in the entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - 'sleep "$${CELLD_RESTART_DELAY_S:-12}" && exec /usr/local/bin/celld'
    environment:
      <<: *bucket-env
      CELLD_ADDR: 0.0.0.0:8080
      CELLD_INTERNAL_ADDR: ${CELLD_INTERNAL_IP:-172.30.70.10}:8081
      CELLD_ADVERTISE: ${CELLD_INTERNAL_IP:-172.30.70.10}:8081
      CELLD_WATCH: /var/lib/celld/state
      CELLD_DEPLOY_POLL_S: ${CELLD_DEPLOY_POLL_S:-15}
      CELLD_RESTART_DELAY_S: ${CELLD_RESTART_DELAY_S:-12}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - celld-state:/var/lib/celld
    networks:
      internal:
        ipv4_address: ${CELLD_INTERNAL_IP:-172.30.70.10}
      edge:
        aliases: [celld-fleet]
    # Graceful SIGTERM drain is bounded by CELLD_SHUTDOWN_TOTAL_MS (40 s).
    stop_grace_period: 50s
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /.well-known/celld/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200"'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      seaweedfs:
        condition: service_healthy
      tools:
        condition: service_completed_successfully

  backup:
    # Optional off-host copy to Backblaze B2. Enable with COMPOSE_PROFILES=backup.
    # Keep versioning on in the B2 bucket (B2's default "keep all versions") so
    # `sync` deletions stay recoverable.
    image: rclone/rclone:${RCLONE_VERSION:-1.71.1}
    profiles: [backup]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          rclone sync "fleet:$${BUCKET}" "b2:$${B2_BUCKET}/$${B2_PREFIX}" --fast-list --transfers 8 --checkers 16 --log-level INFO \
            && echo "backup ok $$(date -u +%FT%TZ)" || echo "backup FAILED $$(date -u +%FT%TZ)" >&2
          sleep "$${BACKUP_INTERVAL_S}"
        done
    environment:
      BUCKET: ${CELLD_BUCKET_NAME:-celld}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_PREFIX: ${B2_PREFIX:-celld-fleet}
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-21600}
      RCLONE_CONFIG_FLEET_TYPE: s3
      RCLONE_CONFIG_FLEET_PROVIDER: SeaweedFS
      RCLONE_CONFIG_FLEET_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_FLEET_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RCLONE_CONFIG_FLEET_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${B2_KEY_ID:-}
      RCLONE_CONFIG_B2_KEY: ${B2_APPLICATION_KEY:-}
    networks: [internal, egress]
    depends_on:
      seaweedfs:
        condition: service_healthy

networks:
  internal:
    name: celld_internal
    internal: true
    ipam:
      config:
        - subnet: ${CELLD_INTERNAL_SUBNET:-172.30.70.0/24}
  edge:
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the Docker network Nginx Proxy Manager is on}
    external: true
  egress:
    name: celld_egress

volumes:
  seaweedfs-data:
  celld-state:
